# DB 서버용 (MySQL만). 웹 서버가 .env의 DB_HOST:DB_PORT 로 여기에 접속한다.
# 실행: sudo docker compose -f compose.db.yml up -d
# 주소는 .env의 DB_BIND 한 줄로 관리한다 (웹 서버가 접속할 이 서버의 IP).
name: shop-db

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command: >
      --slow_query_log=1
      --slow_query_log_file=/var/log/mysql/slow.log
      --long_query_time=0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: shopdb
    volumes:
      - db-data:/var/lib/mysql
      - ./logs/mysql:/var/log/mysql
      - ./deploy/shopdb-dump.sql:/docker-entrypoint-initdb.d/01-dump.sql:ro
      - ./deploy/mysql-init/02-user.sql:/docker-entrypoint-initdb.d/02-user.sql:ro
    ports:
      - "${DB_BIND:?DB_BIND is required}:${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  # 기존 docker-compose.yml이 만든 볼륨을 그대로 이어서 쓴다 (새로 만들면 빈 DB가 된다)
  db-data:
    external: true
    name: sesac_shop_web_php_db-data
